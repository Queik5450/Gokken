<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Consola - Gokken</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
        theme: {
            extend: {
            colors: {
                primary: '#ff0000',
                surface: '#0f0f0f',
                panel: '#141414',
                border: '#1f1f1f'
            },
            fontFamily: {
                sans: ['Roboto', 'ui-sans-serif', 'system-ui']
            }
            }
        }
        }
    </script>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>

<body class="bg-neutral-950 text-gray-100 font-sans">
    <header class="bg-surface/80 backdrop-blur border-b border-border">
        <div class="header-container max-w-6xl mx-auto flex items-center justify-between gap-4 px-4 py-4">
            <div class="logo text-xl font-bold"><a class="logo-btn inline-block px-3 py-2 rounded border border-primary text-primary" href="mainPage.html" aria-label="Volver a la página principal">Gokken</a></div>
            <div class="search-bar flex-1">
                <div class="search-input-wrapper relative flex items-center gap-2 bg-panel border border-border rounded-lg px-3 py-2">
                    <input type="text" placeholder="Buscar" class="w-full bg-transparent outline-none text-gray-100 placeholder-gray-400">
                    <i class="fas fa-search text-primary"></i>
                </div>
            </div>
            <div class="menu-icon text-primary text-2xl"><i class="fas fa-bars"></i></div>
        </div>
    </header>

    <main class="pt-6 pb-10">
        <div class="max-w-6xl mx-auto px-4">
            <div id="platformRoot" class="platform-page space-y-8"></div>
        </div>
    </main>

    <footer class="bg-panel border-t border-border">
        <div class="footer-content max-w-6xl mx-auto px-4 py-6 flex flex-col md:flex-row md:items-center md:justify-between gap-4 text-gray-300">
            <div class="contact-social flex items-center gap-3"><span class="font-semibold">Contactos</span><div class="social-icons text-primary text-xl"><i class="fab fa-discord"></i></div></div>
            <div class="footer-info">Acerca de: xxxxx</div>
        </div>
    </footer>

    <script src="../js/search.js"></script>
    <script src="../js/platform.js"></script>
